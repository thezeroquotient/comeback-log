<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' https://comeback-log-api.clear-product-interviews.workers.dev">
<title>Comeback Log</title>
<meta name="theme-color" content="#ECEEF1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121418" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Comeback">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<style>
/* Layout: one column and three tabs. Chalk grey or rubber-mat grey, with one plate-red accent. */
:root {
  --bg: #ECEEF1; --surface: #FBFCFD; --sunk: #E0E3E8; --ink: #15181D; --ink2: #545C68; --line: #D2D6DC;
  --accent: #C8102E; --on-accent: #fff; --up: #14733E; --down: #B3261E;
  --display: "DIN Condensed", "Avenir Next Condensed", "Roboto Condensed", "sans-serif-condensed", "Arial Narrow", sans-serif;
  --body: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #121418; --surface: #1C1F25; --sunk: #272B32; --ink: #F1F3F5; --ink2: #A2AAB6; --line: #30353D;
    --accent: #F0485F; --on-accent: #1a0509; --up: #5AD28F; --down: #FF8A80;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.4 var(--body);
  padding: env(safe-area-inset-top, 0) max(16px, env(safe-area-inset-right, 0px)) calc(84px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
}
[hidden] { display: none !important; }
main { max-width: 560px; margin: 0 auto; display: grid; gap: 12px; }
h1, h2, h3, p { margin: 0; }
h1 { font: 700 30px/1.1 var(--display); letter-spacing: .02em; }
h2 { font: 700 22px/1.15 var(--display); letter-spacing: .02em; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; padding: 0; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.muted { color: var(--ink2); font-size: 14px; }
.row { display: flex; align-items: center; gap: 8px; }
.between { justify-content: space-between; }
.grow { flex: 1; min-width: 0; }
.stack { display: grid; gap: 10px; }
.top { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding-top: 12px; min-height: 56px; }
.card { background: var(--surface); border-radius: 12px; padding: 14px; display: grid; gap: 10px; box-shadow: inset 0 0 0 1px var(--line); min-width: 0; }
.f { width: 100%; min-width: 0; height: 44px; padding: 0 10px; background: var(--sunk); border: 0; border-radius: 8px; }
.f::placeholder { color: var(--ink2); opacity: .6; }
.btn { height: 44px; padding: 0 14px; border-radius: 8px; background: var(--sunk); font-weight: 600; font-size: 15px; white-space: nowrap; }
.btn.small { height: 34px; padding: 0 10px; font-size: 14px; }
.btn.danger { color: var(--down); }
.icon { width: 40px; height: 40px; border-radius: 8px; color: var(--ink2); font-size: 20px; flex: none; }
.link { color: var(--ink2); font-size: 14px; text-decoration: underline; text-decoration-color: var(--line); text-underline-offset: 3px; text-align: left; }

/* Daily table */
.daily { background: var(--surface); border-radius: 12px; box-shadow: inset 0 0 0 1px var(--line); overflow: clip; }
.daily table { table-layout: fixed; }
.daily th { padding: 10px 2px 6px; text-align: center; color: var(--ink2); font-size: 13px; line-height: 1.15; vertical-align: bottom; position: sticky; top: env(safe-area-inset-top, 0px); background: var(--surface); z-index: 1; box-shadow: 0 1px 0 var(--line); }
.daily td { padding: 5px 2px; border-top: 1px solid var(--line); text-align: center; }
.daily th:first-child, .daily td:first-child { width: 34%; text-align: left; padding-left: 14px; }
.daily td small { display: block; color: var(--ink2); font-size: 12px; line-height: 1.2; }
.daily tr.today td { background: var(--sunk); }
.daily tr.today .dt { color: var(--accent); }
.daily td small.skip { color: var(--down); font-weight: 600; }
.daily .dt { font-weight: 600; font-size: 15px; white-space: nowrap; }
.tick { width: 44px; height: 44px; display: inline-grid; place-items: center; }
.tick i { width: 28px; height: 28px; border-radius: 7px; display: grid; place-items: center; font-style: normal; font-size: 18px; box-shadow: inset 0 0 0 2px var(--line); color: var(--on-accent); background: var(--surface); }
.tick[aria-checked="true"] i { background: var(--accent); box-shadow: none; }

/* Gym */
.datebar { display: flex; align-items: center; gap: 4px; min-width: 0; }
.datebar .label { flex: 1; text-align: center; }
.datebar b { display: block; font: 700 26px/1 var(--display); letter-spacing: .02em; }
.datebar small { color: var(--ink2); font-size: 12px; }
select.pick { font-weight: 600; height: 48px; }
.group { padding: 8px 2px 0; }
.ex { gap: 8px; }
.ex-head { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; font-weight: 600; }
.max { font-size: 14px; color: var(--accent); font-weight: 600; font-variant-numeric: tabular-nums; }
.ex-head span { color: var(--ink2); font-size: 13px; font-weight: 400; white-space: nowrap; font-variant-numeric: tabular-nums; }
.timer { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 2; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 14px; }
.timer b { font: 700 32px/1 var(--display); font-variant-numeric: tabular-nums; letter-spacing: .02em; }
.timer b.over { color: var(--down); }
.timer small { display: block; font-size: 12px; color: var(--ink2); }
.timer .btn { height: 44px; min-width: 96px; font-size: 16px; }
/* After Submit: a white page over the Gym tab, in both themes */
.done { position: fixed; inset: 0 0 calc(61px + env(safe-area-inset-bottom, 0px)); z-index: 4; background: #fff; color: #15181D; display: flex; flex-direction: column; justify-content: center; gap: 28px; text-align: center; padding: calc(24px + env(safe-area-inset-top, 0px)) max(24px, env(safe-area-inset-right, 0px)) 24px max(24px, env(safe-area-inset-left, 0px)); overflow-y: auto; }
.done > * { width: 100%; max-width: 460px; margin: 0 auto; }
.done h1 { font-size: 52px; }
.done p { color: #545C68; font-size: 15px; margin-top: 8px; font-variant-numeric: tabular-nums; }
.done blockquote { margin: 0 auto; font: 700 30px/1.2 var(--display); letter-spacing: .02em; text-wrap: balance; }
.done .btn.primary { width: 100%; background: #C8102E; color: #fff; }
.set { display: grid; grid-template-columns: 52px minmax(0, 1fr) minmax(0, 1fr); gap: 8px; align-items: center; }
.set.head { font-size: 12px; color: var(--ink2); text-align: center; margin-bottom: -4px; }
.set .n { font-size: 14px; color: var(--ink2); }
.set input { text-align: center; font: 600 20px var(--display); font-variant-numeric: tabular-nums; }
.warn { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 14px; }
.set input.bad { box-shadow: inset 0 0 0 2px var(--down); }
.btn.primary { background: var(--accent); color: var(--on-accent); height: 52px; font-size: 17px; }
.win { text-align: center; display: grid; gap: 6px; padding: 12px 0 2px; }
.win b { font: 700 44px/1 var(--display); letter-spacing: .02em; }
.dream { width: 100%; max-height: 46vh; object-fit: cover; object-position: center 30%; border-radius: 10px; display: block; }
.thumb { width: 64px; height: 64px; object-fit: cover; object-position: center 30%; border-radius: 8px; }

/* Analytics */
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--sunk); border-radius: 10px; padding: 3px; }
.seg button { height: 38px; border-radius: 8px; font-weight: 600; font-size: 15px; color: var(--ink2); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); }
.four { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; text-align: center; }
.two { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.big { font: 700 30px/1 var(--display); font-variant-numeric: tabular-nums; }
.tile small { display: block; font-size: 13px; color: var(--ink2); }
.delta { font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums; color: var(--ink2); white-space: nowrap; }
.delta.up { color: var(--up); }
.delta.down { color: var(--down); }
table { border-collapse: collapse; width: 100%; font-size: 14px; font-variant-numeric: tabular-nums; }
.data th { font-size: 12px; font-weight: 500; color: var(--ink2); text-align: right; padding: 4px 6px; white-space: nowrap; }
.data td { text-align: right; padding: 8px 6px; border-top: 1px solid var(--line); white-space: nowrap; }
.data th:first-child, .data td:first-child { text-align: left; padding-left: 0; }
.data td:last-child, .data th:last-child { padding-right: 0; }
.data td.name { white-space: normal; }
.scroll { overflow-x: auto; }
.mbar { display: grid; grid-template-columns: 90px minmax(0, 1fr) 28px; gap: 8px; align-items: center; font-size: 14px; }
.bar { height: 10px; border-radius: 5px; background: var(--sunk); overflow: hidden; }
.bar i { display: block; height: 100%; border-radius: 5px; background: var(--accent); }
.mbar span:last-child { text-align: right; font-variant-numeric: tabular-nums; }
.chart { touch-action: pan-y; }
.chart svg { display: block; width: 100%; height: auto; overflow: visible; }
.chart text { fill: var(--ink2); font: 11px var(--body); font-variant-numeric: tabular-nums; }
.chart .grid { stroke: var(--line); stroke-width: 1; }
.chart .ln { stroke: var(--accent); stroke-width: 2; fill: none; stroke-linejoin: round; }
.chart .area { fill: var(--accent); opacity: .1; }
.chart .pt { fill: var(--accent); stroke: var(--surface); stroke-width: 2; }
.chart .xh { stroke: var(--ink2); stroke-width: 1; stroke-dasharray: 3 3; }
.readout { font-size: 14px; color: var(--ink2); min-height: 20px; font-variant-numeric: tabular-nums; }
.readout b { color: var(--ink); }
.empty { text-align: center; padding: 28px 12px; color: var(--ink2); }

/* Settings */
.plan-ex { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px; padding: 10px 0; border-top: 1px solid var(--line); }
.plan-ex:first-of-type { border-top: 0; }
.plan-nums { display: grid; grid-template-columns: minmax(0, 2.2fr) repeat(3, minmax(0, 1fr)); gap: 6px; grid-column: 1 / -1; }
.plan-nums select, .sched select { appearance: none; -webkit-appearance: none; }
.plan-nums input { padding: 0 4px; text-align: center; }
label.fld { display: grid; gap: 4px; font-size: 13px; color: var(--ink2); min-width: 0; }
label.fld input, label.fld select { color: var(--ink); font-size: 16px; }
.sched { display: grid; grid-template-columns: repeat(auto-fill, minmax(72px, 1fr)); gap: 6px; }
.sched label { font-size: 12px; color: var(--ink2); text-align: center; display: grid; gap: 4px; }
.sched select { height: 44px; padding: 0 2px; font-size: 13px; text-align: center; text-align-last: center; border-radius: 8px; border: 0; background: var(--sunk); color: var(--ink); width: 100%; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }

nav.tabs {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; display: grid; grid-template-columns: repeat(3, 1fr);
  background: var(--surface); border-top: 1px solid var(--line);
  padding: 0 max(16px, env(safe-area-inset-right, 0px)) env(safe-area-inset-bottom, 0px) max(16px, env(safe-area-inset-left, 0px));
}
nav.tabs button { height: 60px; font-weight: 600; font-size: 15px; color: var(--ink2); }
nav.tabs button[aria-current="page"] { color: var(--ink); box-shadow: inset 0 3px 0 var(--accent); }
dialog { border: 0; border-radius: 14px; background: var(--surface); color: var(--ink); padding: 18px; width: min(92vw, 460px); max-height: 80vh; }
dialog::backdrop { background: rgba(0,0,0,.5); }
dialog dl { margin: 12px 0 0; display: grid; gap: 10px; font-size: 14px; }
dialog dt { font-weight: 600; }
dialog dd { margin: 0; color: var(--ink2); font-variant-numeric: tabular-nums; }
#toast { position: fixed; left: 50%; bottom: calc(76px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 8px 14px; border-radius: 8px; font-size: 14px; z-index: 9; max-width: 88vw; }
</style>
</head>
<body>
<main id="app"></main>
<nav class="tabs" id="tabs"></nav>
<dialog id="dlg"></dialog>
<div id="toast" hidden></div>
<script src="logic.js"></script>
<script>
const L = Logic;
const STORE_KEY = 'comeback.v4', LINK_KEY = 'comeback.link';
const API = 'https://comeback-log-api.clear-product-interviews.workers.dev';
const PHOTO_KEY = 'comeback.photo', MOTIVE_KEY = 'comeback.motivated'; // stay on this phone, never synced
const GIST_FILE = 'comeback-log.json';
const GROUPS = ['Chest', 'Shoulders', 'Triceps', 'Back', 'Traps', 'Rear delts', 'Biceps', 'Forearms', 'Quads', 'Hamstrings', 'Glutes', 'Calves', 'Abs', 'Other'];
const COLUMNS = [['gym', 'Gym'], ['food', 'Food'], ['walk', 'Walk 5K'], ['supp', 'Supps']];
const QUOTES = [
  'The only bad workout is the one that didn\'t happen.',
  'You don\'t have to be extreme. Just consistent.',
  'Small progress is still progress.',
  'Show up today. Thank yourself tomorrow.',
  'Discipline is choosing what you want most over what you want now.',
  'Sweat now. Shine later.',
  'Every rep is a vote for who you\'re becoming.',
];
const LINES = [
  'Show up. That is the whole plan.',
  'Nobody regrets the session.',
  'Today\'s reps build that body.',
  'One more workout closer.',
  'Yesterday counts only if you go again.',
  'Do not break the chain.',
  'Future you is watching.',
];

// The PPL exercises from the video, on a Push, Pull, Legs, Rest rotation from Nov 1.
const e = (id, name, group, sets, min, max) => ({ id, name, group, sets, min, max });
const DEFAULT_PLAN = {
  t: 0,
  days: [
    { id: 'push', name: 'Push', exercises: [
      e('bench-press', 'Bench Press', 'Chest', 3, 10, 12),
      e('incline-db-press', 'Incline DB Press', 'Chest', 3, 10, 12),
      e('pec-deck-fly', 'Pec Deck Fly', 'Chest', 3, 12, 15),
      e('shoulder-press', 'Shoulder Press', 'Shoulders', 3, 10, 12),
      e('lateral-raise', 'Lateral Raise', 'Shoulders', 3, 10, 12),
      e('front-raise', 'Front Raise', 'Shoulders', 3, 10, 12),
      e('pushdown', 'Pushdown', 'Triceps', 3, 12, 12),
      e('kick-back', 'Kick Back', 'Triceps', 3, 12, 12),
      e('bench-dips', 'Bench Dips', 'Triceps', 3, 10, 12),
    ] },
    { id: 'pull', name: 'Pull', exercises: [
      e('bent-over-row', 'Bent Over Row', 'Back', 3, 10, 12),
      e('lat-pulldown', 'Lat Pulldown', 'Back', 3, 10, 12),
      e('cable-row', 'Cable Row', 'Back', 3, 10, 12),
      e('face-pull', 'Face Pull', 'Rear delts', 3, 10, 12),
      e('rear-delt-fly', 'Rear Delt Fly', 'Rear delts', 3, 10, 12),
      e('db-shrug', 'DB Shrug', 'Traps', 3, 10, 12),
      e('bicep-curl', 'Bicep Curl', 'Biceps', 3, 10, 12),
      e('hammer-curl', 'Hammer Curl', 'Biceps', 3, 10, 12),
      e('wrist-curl', 'Wrist Curl', 'Forearms', 3, 10, 12),
    ] },
    { id: 'legs', name: 'Legs', exercises: [
      e('barbell-squat', 'Barbell Squat', 'Quads', 3, 10, 12),
      e('db-bulgarian-split', 'DB Bulgarian Split', 'Quads', 3, 10, 12),
      e('leg-curl', 'Leg Curl', 'Hamstrings', 3, 10, 12),
      e('hip-thrust', 'Hip Thrust', 'Glutes', 3, 10, 12),
      e('calf-raise', 'Calf Raise', 'Calves', 4, 10, 12),
      e('bicycle-crunch', 'Bicycle Crunch', 'Abs', 4, 12, 15),
    ] },
  ],
  cycle: ['push', 'pull', 'legs', ''],
};

const read = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } };
const write = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch { return false; } };

const S = read(STORE_KEY, { plan: null, days: {} });
if (!S.plan?.t) S.plan = structuredClone(DEFAULT_PLAN); // never edited, so take the latest default
// The private link carries the key after the #, which is never sent to the website.
if (location.hash.length > 1) write(LINK_KEY, location.hash.slice(1));
const linkKey = () => read(LINK_KEY, '');
const firstOpenDay = () => (L.localKey() > L.START ? L.localKey() : L.START); // nothing before the start date
const ui = { tab: 'daily', date: firstOpenDay(), opened: L.localKey(), sel: null, switchTo: null, view: 'week', week: null, lift: null, metric: 'e1' };
const sync = { state: 'local', at: null, msg: '' };

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const $ = (s, r = document) => r.querySelector(s);
const fmt = (n, dp = 0) => (n === null || n === undefined ? '–' : Number(n).toLocaleString('en-IN', { maximumFractionDigits: dp }));
const dateLabel = k => new Date(k + 'T00:00:00Z').toLocaleDateString('en-IN', { weekday: 'short', day: 'numeric', month: 'short', timeZone: 'UTC' });
const shortDate = k => new Date(k + 'T00:00:00Z').toLocaleDateString('en-IN', { day: 'numeric', month: 'short', timeZone: 'UTC' });
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const deltaHtml = d => {
  if (d === null || d === undefined) return '<span class="delta">–</span>';
  const r = L.round(d, 1);
  if (r === 0) return '<span class="delta">= 0%</span>';
  return `<span class="delta ${r > 0 ? 'up' : 'down'}">${r > 0 ? '▲' : '▼'} ${Math.abs(r)}%</span>`;
};

let saveTimer, syncTimer;
function save() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(flush, 300);
  clearTimeout(syncTimer);
  syncTimer = setTimeout(runSync, 8000);
}
function flush() {
  clearTimeout(saveTimer);
  if (!write(STORE_KEY, S)) toast('Phone storage is full. Save a backup.');
}
function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.hidden = false;
  clearTimeout(toast.t); toast.t = setTimeout(() => (t.hidden = true), 2500);
}

const today = () => L.localKey();
const dayOf = k => (S.days[k] ||= { date: k });
const touch = sec => { sec.t = Date.now(); save(); };
const planDay = id => S.plan.days.find(d => d.id === id);
const cycle = () => (S.plan.cycle ||= structuredClone(DEFAULT_PLAN.cycle));
const scheduledFor = k => planDay(L.cycleDay(k, cycle()));
const notice = (title, text, label, onClose) => dialog(`<div class="win"><b>${esc(title)}</b><span class="muted">${esc(text)}</span></div>`, label, onClose);
const gearBtn = `<button class="icon" data-act="tab" data-id="settings" aria-label="Settings">⚙</button>`;

/* ---------- Daily ---------- */
function renderDaily() {
  const rows = [];
  // Dates in order from the start, always at least two weeks ahead of today.
  const planned = L.addDays(L.START, 29), ahead = L.addDays(today(), 13);
  const last = planned > ahead ? planned : ahead;
  for (let k = L.START; k <= last; k = L.addDays(k, 1)) {
    const c = L.checks(S.days[k]), isToday = k === today(), skipped = L.isSkipped(S.days[k], k, today());
    const name = S.days[k]?.gym?.name || scheduledFor(k)?.name || 'Rest';
    rows.push(`<tr class="${isToday ? 'today' : ''}">
      <td><span class="dt">${esc(dateLabel(k))}</span><small class="${skipped ? 'skip' : ''}">${skipped ? 'Skipped' : esc(name)}</small></td>
      ${COLUMNS.map(([id, label]) => `<td><button class="tick" role="checkbox" aria-checked="${c[id]}" aria-label="${label}, ${esc(dateLabel(k))}" data-act="check" data-id="${id}" data-k="${k}"><i>${c[id] ? '✓' : ''}</i></button></td>`).join('')}
    </tr>`);
  }
  return `
    <div class="top"><h1>Daily</h1>${gearBtn}</div>
    <div class="daily"><table>
      <thead><tr><th></th>${COLUMNS.map(c => `<th>${c[1]}</th>`).join('')}</tr></thead>
      <tbody>${rows.join('')}</tbody>
    </table></div>`;
}

/* ---------- Gym ---------- */
const sessionEx = x => ({
  id: x.id, name: x.name, group: x.group,
  target: { sets: +x.sets, min: +x.min, max: +x.max },
  sets: Array.from({ length: +x.sets || 1 }, () => ({ w: '', r: '' })),
});
// What the Gym tab shows: the saved workout, or the blank one for the chosen day.
function currentSession() {
  const g = S.days[ui.date]?.gym;
  if (g?.name) return g;
  const d = planDay(ui.sel) || (ui.sel === null ? scheduledFor(ui.date) : null);
  return d ? { dayId: d.id, name: d.name, ex: d.exercises.map(sessionEx) } : null;
}
// Saved on the first number typed, so opening the tab never counts as a workout.
function ensureSession() {
  const g = S.days[ui.date]?.gym;
  if (g?.name) return g;
  const c = currentSession();
  return (dayOf(ui.date).gym = { t: 0, ...c });
}
// Works from the start timestamp, so it keeps counting while the phone is locked.
function timerHtml(g) {
  if (g?.startedAt) return `<section class="card timer"><div>${clockHtml(g)}</div></section>`;
  return `<section class="card timer"><div><b>${L.clock(L.IDEAL_SECS)}</b><small>Ideal workout</small></div><button class="btn primary" data-act="start">Start</button></section>`;
}
function clockHtml(g) {

function niceTicks(lo, hi, n = 4) {
  if (lo === hi) { lo = lo * .9; hi = hi * 1.1 || 1; }
  const raw = (hi - lo) / n, mag = 10 ** Math.floor(Math.log10(raw));
  const step = [1, 2, 2.5, 5, 10].map(s => s * mag).find(s => s >= raw);
  const a = Math.floor(lo / step) * step, b = Math.ceil(hi / step) * step, out = [];
  for (let v = a; v <= b + step / 2; v += step) out.push(L.round(v, 2));
  return out;
}
const CHART = { W: 340, H: 190, ML: 40, MR: 10, MT: 10, MB: 24 };
const chartX = (rows, w) => {
  const a = rows[0].week, b = rows[rows.length - 1].week, { W, ML, MR } = CHART;

function chartSvg(rows, m) {
  const { W, H, ML, MR, MT, MB } = CHART;

  const y0 = ticks[0], y1 = ticks[ticks.length - 1];
  const y = v => H - MB - ((v - y0) / (y1 - y0 || 1)) * (H - MT - MB);
  const pts = rows.map(r => [chartX(rows, r.week), y(m.get(r))]);
  const line = pts.map((p, i) => `${i ? 'L' : 'M'}${p[0].toFixed(1)} ${p[1].toFixed(1)}`).join('');
  const area = `${line}L${pts[pts.length - 1][0].toFixed(1)} ${H - MB}L${pts[0][0].toFixed(1)} ${H - MB}Z`;
  const every = Math.ceil(rows.length / 8);
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(m.label)} by week">
    ${ticks.map(t => `<line class="grid" x1="${ML}" x2="${W - MR}" y1="${y(t)}" y2="${y(t)}"/><text x="${ML - 6}" y="${y(t) + 4}" text-anchor="end">${fmt(t, 1)}</text>`).join('')}
    ${rows.length > 1 ? `<path class="area" d="${area}"/><path class="ln" d="${line}"/>` : ''}
    <line class="xh" id="xh" y1="${MT}" y2="${H - MB}" visibility="hidden"/>
    ${pts.map(p => `<circle class="pt" cx="${p[0]}" cy="${p[1]}" r="5"/>`).join('')}
    ${rows.map((r, i) => (i % every === 0 ? `<text x="${pts[i][0]}" y="${H - 6}" text-anchor="middle">W${r.week}</text>` : '')).join('')}
  </svg>`;
}
function bindChart(rows, m) {

  const svg = $('svg', box);

    const xh = $('#xh'), x = chartX(rows, r.week);
    xh.setAttribute('x1', x); xh.setAttribute('x2', x); xh.setAttribute('visibility', 'visible');
  };
  const pick = ev => {
    const b = svg.getBoundingClientRect(), px = ((ev.clientX - b.left) / b.width) * CHART.W;
    show(rows.reduce((best, r) => (Math.abs(chartX(rows, r.week) - px) < Math.abs(chartX(rows, best.week) - px) ? r : best)));
  };
  box.addEventListener('pointermove', pick);
  box.addEventListener('pointerdown', pick);
  show(rows[rows.length - 1]);
}

// Shrunk so it fits in phone storage. Stays on this phone.
function savePhoto(file) {
  const url = URL.createObjectURL(file), img = new Image();
  img.onload = () => {
    const scale = Math.min(1, 800 / Math.max(img.width, img.height)), c = document.createElement('canvas');
    c.width = img.width * scale; c.height = img.height * scale;
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    URL.revokeObjectURL(url);
    if (write(PHOTO_KEY, c.toDataURL('image/jpeg', .8))) render(); else toast('Phone storage is full');
  };
  img.onerror = () => { URL.revokeObjectURL(url); toast('That photo could not be opened'); };
  img.src = url;
}

/* ---------- Sync: every device sends what it has and gets back the merged result ---------- */
const sortDays = s => ({ plan: s.plan, days: Object.fromEntries(Object.keys(s.days || {}).sort().map(k => [k, s.days[k]])) });
const isTyping = () => /INPUT|SELECT/.test(document.activeElement?.tagName || '');
function syncStatus(msg) {
  sync.msg = msg;
  const el = $('#syncmsg');
  if (el) el.textContent = msg;
}
let syncing = false;
async function runSync() {
  clearTimeout(syncTimer);
  if (syncing || !linkKey()) return;
  if (!navigator.onLine) return syncStatus('Offline, saved on this device');
  syncing = true;
  try {
    flush();
    const res = await fetch(API + '/sync', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-Key': linkKey() },
      body: JSON.stringify(S),
    });
    if (res.status === 401) { localStorage.removeItem(LINK_KEY); render(); return; }
    if (!res.ok) throw new Error('Sync ' + res.status);
    const remote = await res.json();
    // Merged again with local data, so anything typed while the request ran is kept.
    const merged = L.mergeStore(S, remote);
    const changed = JSON.stringify(sortDays(S)) !== JSON.stringify(sortDays(merged));
    S.days = merged.days; S.plan = merged.plan || S.plan;
    flush();
    syncStatus('Saved online ' + new Date().toLocaleTimeString('en-IN', { hour: 'numeric', minute: '2-digit' }));
    if (changed && !isTyping()) render();
  } catch {
    syncStatus('Saved on this device, will sync');
  } finally {
    syncing = false;
  }
}

  ui.sel = id;
  if (startedAt && id) { const g = ensureSession(); g.startedAt = startedAt; touch(g); }
}

const actions = {
  tab: el => {
    if (el.dataset.id === 'settings') ui.back = ui.tab;
    ui.tab = el.dataset.id; ui.switchTo = null; render(); showToday();
  },
  start: () => {
    if (!currentSession()) return notice('Select workout', 'Choose a workout, then Start.', 'OK');
    const g = ensureSession();
    g.startedAt = Date.now();
    touch(g); render();
  },
  startnext: el => {
    ui.date = el.dataset.k; ui.sel = el.dataset.id; ui.switchTo = null;
    const g = ensureSession();
    g.startedAt ||= Date.now();
    touch(g); render(); scrollTo(0, 0);
  },
  submit: () => {
    const g = currentSession();
    const missing = [];
    document.querySelectorAll('.set[data-set]').forEach(row => {
      const [w, r] = [$('[data-f=w]', row), $('[data-f=r]', row)];
      const bad = L.num(w.value) !== null && !L.isLogged({ r: r.value });
      r.classList.toggle('bad', bad);
      if (bad) missing.push(r);
    });
    if (missing.length) {
      const first = missing[0];
      return notice('Add reps', first.getAttribute('aria-label').replace(' reps', ''), 'OK', () => {
        first.scrollIntoView({ block: 'center' });
        first.focus();
      });
    }
    if (!g.ex.some(x => x.sets.some(L.isLogged))) return notice('Nothing entered', 'Enter a set, then Submit.', 'OK');
    const saved = ensureSession(), d = S.days[ui.date];
    saved.done = true;
    if (saved.startedAt && !saved.secs) saved.secs = Math.round((Date.now() - saved.startedAt) / 1000); // Submit stops the timer
    touch(saved);
    d.gymck = { t: 0, on: true }; touch(d.gymck);
    flush();
    render(); scrollTo(0, 0);
  },
  delphoto: () => { localStorage.removeItem(PHOTO_KEY); render(); },
  check: el => {
    const { id, k } = el.dataset, d = dayOf(k), key = id === 'gym' ? 'gymck' : id;
    d[key] = { t: 0, on: !L.checks(d)[id] };
    touch(d[key]); render();
  },
  shift: el => { ui.date = L.addDays(ui.date, +el.dataset.n); ui.sel = null; ui.switchTo = null; render(); },
  replace: () => { changeWorkout(ui.switchTo); ui.switchTo = null; render(); },
  keep: () => { ui.switchTo = null; render(); },
  clear: el => {
    if (el.dataset.sure !== '1') { el.dataset.sure = '1'; el.textContent = 'Tap again to clear'; return; }
    blankSession();
    dayOf(ui.date).gymck = { t: 0, on: false }; touch(S.days[ui.date].gymck);
    render();
  },
  addset: el => {
    const g = ensureSession(), x = g.ex[+el.closest('[data-ex]').dataset.ex];
    x.sets.push({ w: '', r: '' });
    touch(g); render();
  },
  view: el => { ui.view = el.dataset.id; render(); },
  week: el => { ui.week = +el.dataset.n; render(); },
  lift: el => { ui.lift = el.dataset.id; ui.view = 'lifts'; render(); scrollTo(0, 0); },
  metric: el => { ui.metric = el.dataset.id; render(); },
  movex: el => {
    const d = S.plan.days[+el.closest('[data-day]').dataset.day], i = +el.closest('[data-x]').dataset.x, j = i + +el.dataset.n;
    if (j < 0 || j >= d.exercises.length) return;
    [d.exercises[i], d.exercises[j]] = [d.exercises[j], d.exercises[i]];
    planTouch(); render();
  },
  delx: el => { S.plan.days[+el.closest('[data-day]').dataset.day].exercises.splice(+el.closest('[data-x]').dataset.x, 1); planTouch(); render(); },
  addx: el => { S.plan.days[+el.closest('[data-day]').dataset.day].exercises.push({ id: 'x' + uid(), name: 'New exercise', group: 'Other', sets: 3, min: 10, max: 12 }); planTouch(); render(); },
  delday: el => {
    if (el.dataset.sure !== '1') { el.dataset.sure = '1'; el.textContent = 'Sure?'; return; }
    const [d] = S.plan.days.splice(+el.closest('[data-day]').dataset.day, 1);
    S.plan.cycle = cycle().map(id => (id === d.id ? '' : id));
    planTouch(); render();
  },
  addcycle: () => { cycle().push(''); planTouch(); render(); },
  delcycle: () => { if (cycle().length > 1) { cycle().pop(); planTouch(); render(); } },
  addday: () => { S.plan.days.push({ id: 'd' + uid(), name: 'New workout', exercises: [] }); planTouch(); render(); },
  copylink: async () => {
    try {
      await navigator.clipboard.writeText(location.origin + location.pathname + '#' + linkKey());
      toast('Link copied');
    } catch { toast('Copy it from the address bar'); }
  },
  help: () => dialog(HELP.calc),
  'csv-sets': () => download('comeback-sets.csv', L.setsCsv(S.days), 'text/csv'),
  'csv-daily': () => download('comeback-daily.csv', L.dailyCsv(S.days), 'text/csv'),
  backup: () => download(`comeback-backup-${today()}.json`, JSON.stringify(S), 'application/json'),
};

document.addEventListener('click', ev => {
  const el = ev.target.closest('[data-act]');
  if (el && !el.disabled) actions[el.dataset.act](el, ev);
});
document.addEventListener('input', ev => {
  const el = ev.target;
  if (el.dataset.f) {
    // Numbers only: digits and one decimal point.
    const [whole, ...rest] = el.value.replace(/[^0-9.]/g, '').split('.');
    el.value = whole + (rest.length ? '.' + rest.join('') : '');
    el.classList.remove('bad');
    const g = ensureSession(), x = g.ex[+el.closest('[data-ex]').dataset.ex];
    x.sets[+el.closest('[data-set]').dataset.set][el.dataset.f] = el.value;
    touch(g);
  } else if (el.dataset.p) {
    const p = el.dataset.p, P = S.plan;
    if (p === 'cycle') cycle()[+el.dataset.i] = el.value;
    else if (p === 'dayname') P.days[+el.closest('[data-day]').dataset.day].name = el.value;
    else if (p === 'x') P.days[+el.closest('[data-day]').dataset.day].exercises[+el.closest('[data-x]').dataset.x][el.dataset.k] = el.value;
    planTouch();
  }
});
document.addEventListener('change', ev => {
  const el = ev.target;
  if (el.id === 'daysel') {
    if (L.hasSets(S.days[ui.date])) { ui.switchTo = el.value; render(); return; }
    changeWorkout(el.value); render();
  }
  if (el.id === 'liftsel') { ui.lift = el.value; render(); }
  if (el.id === 'photo' && el.files[0]) savePhoto(el.files[0]);
  if (el.id === 'restore' && el.files[0]) {
    el.files[0].text().then(text => {
      const data = JSON.parse(text);
      if (!data.days) throw new Error('bad file');
      const m = L.mergeStore(S, data);
      S.days = m.days; S.plan = m.plan || S.plan;
      flush(); render(); toast('Restored');
    }).catch(() => toast('That file is not a backup'));
  }
});
// Saves immediately when the phone locks or the app is switched away.
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { flush(); runSync(); return; }
  runSync();
  if (ui.opened !== today()) { // left open overnight: move on to the new day
    ui.opened = today(); ui.date = firstOpenDay(); ui.sel = null; ui.switchTo = null;
    render(); showToday(); motivate();
  }
});
window.addEventListener('pagehide', flush);
window.addEventListener('online', runSync);
window.addEventListener('hashchange', () => location.reload());
setInterval(() => { if (!document.hidden) runSync(); }, 30000); // picks up changes from another device
setInterval(() => {
  const g = S.days[ui.date]?.gym;
  if (ui.tab === 'gym' && g?.startedAt && !g.secs) { const el = $('.timer div'); if (el) el.innerHTML = clockHtml(g); }
}, 1000);

render();
showToday();
motivate();
runSync();
navigator.storage?.persist?.();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
